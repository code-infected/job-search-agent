name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest==9.2.0 ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
