<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Agent</title>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --ink: #1c1c1a; --muted: #66665f; --line: #ddddd6; --accent: #2b5fa8; --good: #2e7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171716; --card: #21211f; --ink: #ecece7; --muted: #a0a097; --line: #383835; --accent: #7fa8e0; --good: #7fcf9f; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 820px; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button { padding: 8px 14px; font: inherit; color: var(--accent); background: none; border: 1px solid currentColor; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  label { color: var(--muted); font-size: 14px; }
  .panel { padding: 12px 16px; margin-bottom: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .running::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--good); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: 0.2; } }
  .muted { color: var(--muted); font-size: 14px; }
  .job { padding: 12px 0; border-top: 1px solid var(--line); }
  .job a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
  .fit { display: inline-block; min-width: 3.2em; font-variant-numeric: tabular-nums; font-weight: 600; }
  .fit.match { color: var(--good); }
  .note { margin-top: 4px; font-size: 14px; color: var(--good); }
  details { margin-top: 4px; font-size: 14px; }
  pre { margin: 6px 0; white-space: pre-wrap; font: inherit; }
</style>
</head>
<body>
<h1>Job Search Agent</h1>
<div class="panel">
  <div class="row">
    <button id="run">Start run</button>
    <span id="progress" role="status"></span>
  </div>
  <div class="muted">A run searches your job boards, scores each new posting against your profile, and drafts outreach for strong matches. Drafts wait for you in the terminal: <code>python cli.py pending</code>.</div>
</div>
<div class="row">
  <button id="csv">Download CSV</button>
  <label><input id="matches-only" type="checkbox"> Matches only</label>
</div>
<p id="summary" class="muted"></p>
<section id="jobs"></section>
<template id="job">
  <div class="job">
    <span class="fit"></span> <a class="title" target="_blank" rel="noopener noreferrer"></a>
    <div class="muted meta"></div>
    <div class="note" hidden>Draft ready. Review it in the terminal: python cli.py pending</div>
    <details><summary>Why this score</summary><pre class="why"></pre></details>
  </div>
</template>
<script>
  // Job titles and reasoning come from the open web, so everything is set with textContent.
  const BELOW = "Below fit threshold";
  const runButton = document.getElementById("run");
  const progressLine = document.getElementById("progress");
  const summary = document.getElementById("summary");
  const jobsList = document.getElementById("jobs");
  const matchesOnly = document.getElementById("matches-only");
  let jobs = [];
  let timer = null;

  async function getJson(path, options) {
    const response = await fetch(path, options);
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed: ${response.status}`);
    return body;
  }

  function renderJob(job) {
    const row = document.getElementById("job").content.cloneNode(true);
    const fit = row.querySelector(".fit");
    fit.textContent = job.fit_score === null ? "-" : Number(job.fit_score).toFixed(2);
    fit.classList.toggle("match", job.status !== BELOW && job.fit_score !== null);
    const link = row.querySelector(".title");
    link.textContent = job.title || job.url;
    if (/^https?:\/\//i.test(job.url)) link.href = job.url; // never a javascript: link
    const meta = [job.location, job.status, job.rejection_reason && `Your reason: ${job.rejection_reason}`];
    row.querySelector(".meta").textContent = meta.filter(Boolean).join("  ·  ");
    row.querySelector(".note").hidden = job.status !== "Waiting for review";
    row.querySelector(".why").textContent = job.fit_reasoning;
    return row;
  }

  function renderJobs() {
    const shown = matchesOnly.checked ? jobs.filter((job) => job.status !== BELOW && job.status !== "Failed") : jobs;
    jobsList.replaceChildren(...shown.map(renderJob));
    const matches = jobs.filter((job) => job.status !== BELOW && job.status !== "Failed").length;
    summary.textContent = jobs.length
      ? `${jobs.length} jobs found, ${matches} passed the fit threshold. Best fit first.`
      : "No jobs yet. Start a run.";
  }

  async function refresh() {
    try {
      const state = await getJson("/status");
      progressLine.textContent = state.message;
      progressLine.classList.toggle("running", state.running);
      runButton.disabled = state.running;
      jobs = await getJson("/jobs");
      renderJobs();
      clearTimeout(timer);
      if (state.running) timer = setTimeout(refresh, 3000);
    } catch (error) {
      progressLine.textContent = error.message;
    }
  }

  runButton.addEventListener("click", async () => {
    try {
      await getJson("/runs", { method: "POST" });
    } catch (error) {
      progressLine.textContent = error.message;
    }
    refresh();
  });
  matchesOnly.addEventListener("change", renderJobs);
  document.getElementById("csv").addEventListener("click", () => { window.location.href = "/jobs.csv"; });
  refresh();
</script>
</body>
</html>
