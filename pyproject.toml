[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP007", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S105", "S106", "E501"]
